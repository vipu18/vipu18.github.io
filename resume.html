<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Resume — Vipanshu Suman</title>
  <meta name="description" content="View Vipanshu Kumar Suman's resume — B.Tech Computer Science student passionate about ML, IoT, and innovative tech solutions.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d16">
  <link rel="icon" type="image/x-icon" href="./assets/images/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/resume.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        if (saved) document.documentElement.setAttribute('data-theme', saved);
        else document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
</head>
<body>
  <header id="topnav">
    <div class="nav-inner">
      <a href="./index.html" class="brand" aria-label="Back to portfolio"><span class="brand-mark" aria-hidden="true">VS</span></a>
      <nav class="nav-links" aria-label="Primary">
        <a href="./index.html#about">About</a>
        <a href="./index.html#education">Education</a>
        <a href="./index.html#skills">Skills</a>
        <a href="./index.html#projects">Projects</a>
        <a href="./index.html#certificates"><span class="long">Certificates</span><span class="short">Certs</span></a>
        <a href="./index.html#contact">Contact</a>
      </nav>
      <div class="nav-actions">
        <a href="./assets/resume.pdf" download class="resume-link">Download ↓</a>
        <button id="theme-toggle" aria-label="Toggle dark/light theme" title="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="resume-main">
    <div class="resume-head">
      <a href="./index.html#about" class="back-link" aria-label="Back to portfolio">←</a>
      <h1>Resume</h1>
      <a href="./assets/resume.pdf" download class="btn btn-solid btn-small">Download PDF ↓</a>
    </div>

    <div id="pdf-viewer">
      <iframe src="./assets/resume.pdf" title="Resume preview"></iframe>
    </div>
    <p class="viewer-note">Preview not showing? <a href="./assets/resume.pdf" download>Download PDF ↓</a></p>

    <footer>
      <p>Made with <span class="heart">♥</span> by Vipanshu Suman</p>
    </footer>
  </main>

  <script>
    document.getElementById('theme-toggle').addEventListener('click', function () {
      var html = document.documentElement;
      var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    var topnav = document.getElementById('topnav');
    window.addEventListener('scroll', function () {
      var st = document.documentElement.scrollTop;
      topnav.classList.toggle('scrolled', st > 8);
    }, { passive: true });
  </script>
</body>
</html>
